<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Demo</title>
  <link rel="stylesheet" href="execrise2.css">
</head>
<body>
  <h1>Box Model Comparison</h1>

  <div class="card-content">
    <p>
      Content-box card: declared width = 300px, but rendered width = 
      300 + 24 + 24 + 2 + 2 = <strong>352px</strong>.
    </p>
  </div>

  <div class="card-border">
    <p>
      Border-box card: declared width = <strong>300px total</strong>, 
      because padding and border are included inside.
    </p>
  </div>
</body>
</html>
