<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Addis Market Shopping List</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Addis Market</h1>
    <p>My Shopping List</p>

    <form id="add-form">

      <input
        type="text"
        id="name"
        placeholder="Item name"
      >

      <input
        type="number"
        id="price"
        placeholder="Price in ETB"
      >

      <button type="submit">
        Add Item
      </button>

    </form>

    <p id="error"></p>

    <ul id="list"></ul>

    <div class="total">
      Total: <span id="total">0</span> ETB
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
