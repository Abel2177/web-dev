<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Country Facts</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      flex: 1;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    #facts {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
    }

    .fact {
      margin: 10px 0;
    }

    .fact strong {
      display: inline-block;
      width: 100px;
    }

    .flag {
      width: 150px;
      margin-bottom: 20px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>Country Facts</h1>

  <form id="searchForm">

    <input
      type="text"
      id="countryInput"
      value="Ethiopia"
      placeholder="Enter country name"
    >

    <button type="submit">
      Search
    </button>

  </form>

  <div id="facts"></div>

  <script src="script.js"></script>

</body>
</html>
