<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Habesha Eatery in Addis Ababa. Send us a message or check our opening hours.">
  <title>Habesha Eatery – Contact</title>
</head>
<body>
  <header>
    <h1>Contact Habesha Eatery</h1>
    <nav>
      <ul>
        <li><a href="index.html">Reservations</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section main="contact-heading">
      <h2 id="contact-heading">Send Us a Message</h2>
      <form action="/contact" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit">Send</button>
      </form>
    </section>


    <section main="hours-heading">
      <h2 id="hours-heading">Opening Hours</h2>
      <table>
        <caption>Habesha Eatery Opening Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Monday</td><td>10:00 – 22:00</td></tr>
          <tr><td>Tuesday</td><td>10:00 – 22:00</td></tr>
          <tr><td>Wednesday</td><td>10:00 – 22:00</td></tr>
          <tr><td>Thursday</td><td>10:00 – 22:00</td></tr>
          <tr><td>Friday</td><td>10:00 – 23:00</td></tr>
          <tr><td>Saturday</td><td>12:00 – 23:00</td></tr>
          <tr><td>Sunday</td><td>Closed</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Habesha Eatery</p>
  </footer>
</body>
</html>
