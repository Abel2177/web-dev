<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve a table at Habesha Eatery in Addis Ababa. View our ETB menu and explore Ethiopian cuisine.">
  <title>Habesha Eatery – Reservations</title>
</head>
<body>
  <header>
    <h1>Habesha Eatery Reservations</h1>
    <nav>
      <ul>
        <li><a href="index.html">Reservations</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section main-reservation="reservation-heading">
      <h2 id="reservation-heading">Book a Table</h2>
      <form action="/reserve" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="date">Reservation Date:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="time">Reservation Time:</label>
        <input type="time" id="time" name="time" required><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" required><br><br>

        <button type="submit">Reserve</button>
      </form>
    </section>


    <section menu-bar="menu-heading">
      <h2 id="menu-heading">Menu (Prices in ETB)</h2>
      <table>
        <caption>Habesha Eatery Menu</caption>
        <thead>
          <tr>
            <th scope="col">Dish</th>
            <th scope="col">Price (ETB)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Injera with Doro Wat</td><td>150</td></tr>
          <tr><td>Kitfo</td><td>200</td></tr>
          <tr><td>Shiro</td><td>120</td></tr>
          <tr><td>Tibs</td><td>180</td></tr>
          <tr><td>Vegetarian Combo</td><td>140</td></tr>
        </tbody>
      </table>
    </section>

    <section images="media-heading">
      <h2 id="media-heading">Our Cuisine & Location</h2>
      <figure>
        <img src="injera.jpg" alt="Traditional Ethiopian injera served with colorful stews">
        <figcaption>Injera – Ethiopia’s iconic flatbread, central to our menu.</figcaption>
      </figure>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1994.123456789!2d38.7578!3d9.0108!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b85c5d6f12345%3A0xabcdef123456789!2sMeskel%20Square!5e0!3m2!1sen!2set!4v1620000000000!5m2!1sen!2set" 
        width="600" height="450" style="border:0;" 
        allowfullscreen="" loading="lazy" 
        title="Map showing Habesha Eatery in Addis Ababa">
      </iframe>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Habesha Eatery</p>
  </footer>
</body>
</html>
